name: Validate Sec Ops

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Build, Testes (JaCoCo) e SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=MaryGraywolf_mini-orm
          -Dsonar.organization=marygraywolf2403
          -Dsonar.host.url=https://sonarcloud.io

  security_sast:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Instalar e Executar Semgrep Nativo
        run: |
          python -m pip install --only-binary :all: semgrep==1.90.0
          semgrep scan --config="p/java" --sarif --output=semgrep.sarif

      - name: Upload do relatório para o GitHub Security
        uses: github/codeql-action/upload-sarif@f6e388ebf0efc915c6c5b165b019ee61a6746a38
        if: always()
        with:
          sarif_file: semgrep.sarif

  notify_failure:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Set error message variables
        id: error_info
        run: |
          echo "error_message=A pipeline falhou no branch \({{ github.ref_name }}." >>\)GITHUB_OUTPUT
          echo "job_url=\({{ github.server_url }}/\){{ github.repository }}/actions/runs/\({{ github.run_id }}" >>\)GITHUB_OUTPUT

      - name: Enviar alerta para o Microsoft Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "E81123",
            "summary": "Falha na Pipeline DevSecOps",
            "title": "🚨 Falha na Pipeline DevSecOps!",
            "sections": [{
              "activityTitle": "Ocorreu um erro durante a execução da pipeline.",
              "facts": [{
                "name": "Repositório:",
                "value": "${{ github.repository }}"
              }, {
                "name": "Branch:",
                "value": "${{ github.ref_name }}"
              }],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "Acessar Logs",
              "targets": [{
                "os": "default",
                "uri": "${{ steps.error_info.outputs.job_url }}"
              }]
            }]
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
